<!doctype html>
<html lang="en" data-theme="midnight">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111622" id="themeColor">
<title>FlowState — Flowchart Editor</title>
<meta name="description" content="A fast, friendly flowchart editor that runs in your browser: templates, swimlanes, Mermaid, code to flowchart and live logic checks.">
<link rel="stylesheet" href="css/app.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 64 64%22%3E%3Crect width=%2264%22 height=%2264%22 rx=%2214%22 fill=%22%23c8ff00%22/%3E%3Cpath d=%22M20 51V16h22M20 33h18%22 stroke=%22%23060606%22 stroke-width=%227%22 fill=%22none%22 stroke-linecap=%22round%22 stroke-linejoin=%22round%22/%3E%3Cpath d=%22M40 8l12 8-12 8z%22 fill=%22%23060606%22/%3E%3C/svg%3E">
</head>
<body>
<a class="skiplink" href="#canvas">Skip to canvas</a>

<header class="topbar">
  <button class="btn icon ghost" id="btnMenu" title="Menu" aria-label="Menu" aria-haspopup="menu"></button>
  <div class="brand" title="FlowState">
    <svg viewBox="0 0 64 64" width="28" height="28" aria-hidden="true"><rect width="64" height="64" rx="14" class="brand-bg"/><path d="M20 51V16h22M20 33h18" class="brand-fg" stroke-width="7" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M40 8l12 8-12 8z" class="brand-ink"/></svg>
    <span>FlowState</span>
  </div>
  <label class="sr" for="projName">Project name</label>
  <input id="projName" class="projname" type="text" placeholder="Untitled flowchart" autocomplete="off" spellcheck="false">
  <div class="tbar">
    <button class="btn icon ghost" id="btnUndo" title="Undo (Ctrl+Z)" aria-label="Undo"></button>
    <button class="btn icon ghost" id="btnRedo" title="Redo (Ctrl+Shift+Z)" aria-label="Redo"></button>
    <button class="btn icon ghost" id="btnTheme" title="Theme" aria-label="Theme" aria-haspopup="menu"></button>
    <button class="btn icon ghost hide-sm" id="btnHelp" title="Keyboard shortcuts (?)" aria-label="Keyboard shortcuts"></button>
    <button class="btn primary" id="btnExport" title="Export image (Ctrl+E)">Export</button>
  </div>
</header>

<div class="shell">
  <nav class="dock" aria-label="Add, templates and create">
    <button class="dock-btn" data-panel="add" aria-label="Elements"><span class="dk-ic" data-icon="shapes"></span><span class="dk-t">Elements</span></button>
    <button class="dock-btn" data-panel="templates" aria-label="Templates"><span class="dk-ic" data-icon="templates"></span><span class="dk-t">Templates</span></button>
    <button class="dock-btn" data-panel="create" aria-label="Create"><span class="dk-ic" data-icon="create"></span><span class="dk-t">Create</span></button>
    <button class="dock-btn dock-m" data-panel="design" aria-label="Design"><span class="dk-ic" data-icon="design"></span><span class="dk-t">Design</span></button>
    <button class="dock-btn dock-m" data-panel="checks" aria-label="Checks"><span class="dk-ic" data-icon="check"></span><span class="dk-t">Checks</span><span class="pill" id="dockPill">0</span></button>
  </nav>

  <aside class="side collapsed" id="leftRail" aria-label="Elements, templates and create">
    <div class="sheet-grab" aria-hidden="true"></div>
    <div class="rail-head"><strong id="sideTitle">Elements</strong><button class="btn icon ghost railclose" data-close="left" title="Close" aria-label="Close panel" data-icon="close"></button></div>
    <div class="side-pane" data-pane="add">
      <p class="hint-note">Tap a shape, then tap the canvas. On a computer you can also drag it in.</p>
      <div id="palette" class="palette"></div>
    </div>
    <div class="side-pane" data-pane="templates"><div id="templateList" class="templates"></div></div>
    <div class="side-pane" data-pane="create">
      <div class="cards">
        <button class="card" id="crBlank"><span data-icon="plus"></span><b>Blank chart</b><i>Start from nothing</i></button>
        <button class="card" id="crCode"><span data-icon="code"></span><b>From code</b><i>Python, JS, C++, C#</i></button>
        <button class="card" id="crToCode"><span data-icon="code"></span><b>To code</b><i>Turn this chart into code</i></button>
        <button class="card" id="crMermaid"><span data-icon="graph"></span><b>Mermaid</b><i>Paste or copy text</i></button>
        <button class="card" id="crImport"><span data-icon="upload"></span><b>Open a backup</b><i>.json file</i></button>
        <button class="card" id="crProjects"><span data-icon="folder"></span><b>My projects</b><i>Saved in this browser</i></button>
      </div>
    </div>
  </aside>

  <main class="stage" id="stage">
    <div class="stage-top">
      <div class="group seg-tools" role="group" aria-label="Tools">
        <button class="btn tool active" data-tool="select" title="Select / move (V)" aria-label="Select"><span data-icon="cursor"></span><span class="tl">Select</span></button>
        <button class="btn tool" data-tool="pan" title="Pan (H, or hold Space)" aria-label="Pan"><span data-icon="move"></span><span class="tl">Pan</span></button>
        <button class="btn tool" data-tool="connect" title="Connect steps (C)" aria-label="Connect"><span data-icon="connect"></span><span class="tl">Connect</span></button>
      </div>
      <div class="group push" role="group" aria-label="Canvas options">
        <button class="btn toggle" id="btnGrid" title="Show grid (G)" aria-label="Grid"><span data-icon="grid"></span><span class="tl">Grid</span></button>
        <button class="btn toggle" id="btnSnap" title="Snap to grid and guides" aria-label="Snap"><span data-icon="magnet"></span><span class="tl">Snap</span></button>
        <button class="btn" id="btnArrange" title="Auto layout, align and tidy" aria-label="Arrange" aria-haspopup="menu"><span data-icon="layout"></span><span class="tl">Arrange</span></button>
        <button class="btn icon" id="btnSearch" title="Search in chart (Ctrl+F)" aria-label="Search" data-icon="search"></button>
      </div>
    </div>

    <div class="canvas-wrap">
      <svg id="canvas" tabindex="0" role="application" aria-label="Flowchart canvas. Use arrow keys to move between steps."></svg>
      <div class="editor-layer" id="editorLayer"></div>
      <div class="ctxbar" id="ctxBar" hidden role="toolbar" aria-label="Selection tools"></div>

      <div class="empty-state" id="emptyState" hidden>
        <h2>What will you create?</h2>
        <p>Pick a way to start, or just tap the canvas twice to add your first step.</p>
        <div class="cards es-cards">
          <button class="card" id="esNew"><span data-icon="plus"></span><b>Blank chart</b><i>Draw your own</i></button>
          <button class="card" id="esTemplate"><span data-icon="templates"></span><b>Templates</b><i>13 ready to edit</i></button>
          <button class="card" id="esCode"><span data-icon="code"></span><b>From code</b><i>Python, JS, C++, C#</i></button>
          <button class="card" id="esMermaid"><span data-icon="graph"></span><b>Mermaid</b><i>Turn text into a chart</i></button>
          <button class="card" id="esImport"><span data-icon="upload"></span><b>Open a backup</b><i>.json file</i></button>
        </div>
      </div>

      <div class="searchbar" id="searchBar" hidden>
        <input type="search" id="searchInput" placeholder="Find steps, labels or code…" aria-label="Search in chart">
        <span id="searchCount" class="muted">0</span>
        <button class="btn icon ghost" id="searchPrev" title="Previous (Shift+Enter)" aria-label="Previous match">&#8593;</button>
        <button class="btn icon ghost" id="searchNext" title="Next (Enter)" aria-label="Next match">&#8595;</button>
        <button class="btn icon ghost" id="searchClose" title="Close (Esc)" aria-label="Close search" data-icon="close"></button>
      </div>

      <div class="zoombar">
        <button class="btn icon ghost" id="btnZoomOut" title="Zoom out (Ctrl+-)" aria-label="Zoom out" data-icon="minus"></button>
        <button class="btn ghost" id="btnZoomLevel" title="Reset zoom to 100%">100%</button>
        <button class="btn icon ghost" id="btnZoomIn" title="Zoom in (Ctrl++)" aria-label="Zoom in" data-icon="plus"></button>
        <button class="btn icon ghost" id="btnFit" title="Fit to view (Shift+1)" aria-label="Fit to view" data-icon="fit"></button>
      </div>
    </div>
  </main>

  <aside class="rail rail-right collapsed" id="rightRail" aria-label="Design, code and checks">
    <div class="sheet-grab" aria-hidden="true"></div>
    <div class="rail-head tabs" role="tablist">
      <button class="tab active" role="tab" data-tab="design" aria-selected="true">Design</button>
      <button class="tab" role="tab" data-tab="code" aria-selected="false">Code</button>
      <button class="tab" role="tab" data-tab="checks" aria-selected="false">Checks <span class="pill" id="checkPill">0</span></button>
      <button class="btn icon ghost railclose" data-close="right" title="Close" aria-label="Close panel" data-icon="close"></button>
    </div>
    <div class="tabpane active" id="pane-design" role="tabpanel"></div>
    <div class="tabpane" id="pane-code" role="tabpanel"></div>
    <div class="tabpane" id="pane-checks" role="tabpanel"></div>
  </aside>
</div>

<footer class="statusbar">
  <span id="stCounts">0 steps · 0 connections</span>
  <span class="dot">·</span>
  <span id="stSel">Nothing selected</span>
  <button class="btn danger" id="stDelete" hidden title="Delete the selection (Delete key)"></button>
  <span class="push"></span>
  <span id="stChecks" class="muted">Checks: —</span>
  <span class="dot">·</span>
  <span id="stSave" class="muted">Ready</span>
</footer>

<div id="modals"></div>
<div id="toasts" class="toasts" aria-live="polite"></div>
<div id="live" class="sr" aria-live="polite" aria-atomic="true"></div>
<input type="file" id="filePicker" accept="application/json,.json,image/png,.png,image/svg+xml,.svg" class="sr">

<script type="module" src="js/app.js"></script>
</body>
</html>
